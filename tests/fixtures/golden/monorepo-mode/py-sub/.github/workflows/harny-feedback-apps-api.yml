name: "harny feedback (apps/api)"
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  feedback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      # <!-- harny:begin generated project configuration -->

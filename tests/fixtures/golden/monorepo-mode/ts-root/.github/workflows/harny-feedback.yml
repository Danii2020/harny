# Generated by harny — the shared computational-feedback CI gate
# (contract.md "agent-feedback-controls", intent.md G3). GitHub reads
# `.github/workflows/` only at a repository ROOT, so this file always lives at
# the root even when the harness that generated it was installed in a
# subdirectory. For a subdirectory install the file is named after the
# install path (e.g. `harny-feedback-apps-web.yml`) and its generated steps
# each declare that subdirectory as the directory they run from
# (contract.md "ci-workflow-root").
#
# Everything outside the generated-block markers below — the triggers, the
# job, the checkout step, and this comment — is canonical and copied verbatim
# by every run, with exactly one exception: for a subdirectory install the
# `name:` line below is rewritten to name the subdirectory, so two harnesses
# in one repository are distinguishable in the checks list. Nothing else
# outside the markers ever varies. Do not hand-edit the generated block —
# re-run `harny init` instead; edits there are overwritten on the next run.
#
# Two triggers, both canonical: `pull_request` checks a change before integration, and
# `push` to `main` checks it after — a change merged or pushed straight to the default
# branch would otherwise never be checked at all. `main` is written literally because
# `harny init` cannot know a repository's default branch; if yours is named something
# else (`master`, `trunk`, `develop`), change it here — this is the one value in this
# file harny expects a project to adjust by hand. A pull-request branch never
# double-runs: `push` is filtered to `main`, so the two triggers never match the same
# commit on a topic branch.
#
# The generated block invokes the same shared runner as the Stop hook
# (templates/hooks/README.md), `.sdd/feedback/run-feedback.mjs`, in its
# `run --whole-project` mode — never a raw per-command step. At most one
# dependency-install step runs first, only when the resolved stack profile
# declares install candidates (the first whose gate file is present in this
# checkout); then exactly one step invokes the runner, which evaluates each
# command's presence probe itself (absent tooling is skipped, never failed)
# and checks the whole project, never a per-turn touched-file set. A finding
# is the one case where the runner's exit 2 is not translated: it fails the
# step, and the job, directly — there is no agent turn to protect here.
name: harny feedback
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  feedback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # <!-- harny:begin generated project configuration -->
      - name: "Install dependencies (TypeScript / Node)"
        run: "if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install --no-audit --no-fund; else echo 'harny-feedback: no package.json in this checkout; skipping dependency install'; fi"
      - name: "harny feedback (TypeScript / Node)"
        run: "test -f .sdd/feedback/run-feedback.mjs -a -f .sdd/shared/probes.mjs || { echo 'harny-feedback: .sdd/feedback/run-feedback.mjs or .sdd/shared/probes.mjs is missing from this checkout; run npx harny init and commit both'; exit 1; }; node .sdd/feedback/run-feedback.mjs run --whole-project --commands '[{\"id\":\"eslint\",\"kind\":\"lint\",\"argv\":[\"npx\",\"eslint\"],\"pathMode\":\"per-file\",\"extensions\":[\".ts\",\".tsx\",\".js\",\".jsx\",\".mjs\",\".cjs\",\".mts\",\".cts\"],\"requires\":{\"anyFile\":[\"eslint.config.js\",\"eslint.config.mjs\",\".eslintrc.json\",\".eslintrc.cjs\"]}},{\"id\":\"tsc\",\"kind\":\"typecheck\",\"argv\":[\"npx\",\"tsc\",\"--noEmit\"],\"pathMode\":\"whole-project\",\"requires\":{\"anyFile\":[\"tsconfig.json\"]}}]'"
      # <!-- harny:end generated project configuration -->
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          RANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RANGE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "$release/$archive"
          curl -sSfL -o "$RUNNER_TEMP/checksums.txt" "$release/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $archive\$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          if [ -n "$RANGE_BASE" ] && [ -n "$(printf '%s' "$RANGE_BASE" | tr -d 0)" ]; then
            log_opts="$RANGE_BASE..$RANGE_HEAD"
          else
            log_opts="-1 $RANGE_HEAD"
          fi
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="$log_opts" .
